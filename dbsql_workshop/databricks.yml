# Bean & Brew Coffee Co. - Databricks SQL workshop in a box.
#
# Deploy sets up the workshop: three schemas, the raw (bronze) data, empty silver and gold tables with keys, three
# metric views, and on top of them an AI/BI dashboard, a Genie agent and three SQL alerts. The workshop notebook
# "Bean & Brew DBSQL Workshop.sql" fills the tables, so those assets come to life as participants work through it.
# Destroy removes everything the deploy created. See README.md.
bundle:
  name: dbsql_workshop
  # job_runs (the setup that runs during deploy) needs Databricks CLI 1.7.0 or later
  databricks_cli_version: ">= 1.7.0"

include:
  - resources/*.yml

variables:
  catalog:
    description: >-
      Existing Unity Catalog catalog for the demo. The bundle creates (and destroy drops) only its own three
      schemas in it; the catalog itself is never changed. Defaults to `workspace`, the default catalog in Databricks
      Free Edition.
    # No `workspace` catalog in your workspace? Replace it below with a catalog you can create schemas in, then deploy
    # again. See "Use your own catalog" in README.md.
    default: workspace
  warehouse_id:
    description: >-
      SQL warehouse for the setup job, the dashboard, the Genie agent and the alerts. Found by name; every new
      workspace (including Free Edition) has a Serverless Starter Warehouse. The bundle never creates or changes it.
    # Renamed or removed the Starter warehouse? Put the name of a SQL warehouse you can use here, then deploy again.
    lookup:
      warehouse: Serverless Starter Warehouse
  alert_email:
    description: Subscriber for the three SQL alerts (their schedules start paused).
    default: ${workspace.current_user.userName}

# No deployment mode: the names are fixed, so there is one copy per workspace and a second deploy of it fails on the
# existing schemas instead of creating duplicates. Schemas become dbsql_workshop_bronze|silver|gold and every other
# resource "[dbsql_workshop] ...".
presets:
  name_prefix: "[dbsql_workshop] "
  trigger_pause_status: PAUSED
  tags:
    workshop: dbsql_workshop

targets:
  dev:
    # Default target, used by Open in Databricks. No host: it deploys to the workspace it is opened in.
    default: true

  fevm:
    # Base deployment workspace for the workshop team
    workspace:
      host: https://fevm-for-startups-demos.cloud.databricks.com
    variables:
      catalog: for_startups_demos_catalog
