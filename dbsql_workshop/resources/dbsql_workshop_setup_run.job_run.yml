# Runs the setup job as part of every deploy that changes the setup notebooks. The deploy waits for the run and fails
# if it fails. The dashboard, Genie agent and alerts are created after it, so the tables they read exist.
resources:
  job_runs:
    dbsql_workshop_setup_run:
      job_id: ${resources.jobs.dbsql_workshop_setup.id}
      lifecycle:
        # Re-run when a setup notebook changes. A failed run is retried on the next deploy.
        triggers:
          - on_file_change: ../src/setup/*
