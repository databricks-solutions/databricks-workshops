# The demo's own SQL warehouse: the smallest serverless size, one cluster, and the shortest auto-stop.
resources:
  sql_warehouses:
    dbsql_workshop_warehouse:
      name: Bean & Brew Warehouse
      warehouse_type: PRO
      enable_serverless_compute: true
      cluster_size: 2X-Small
      min_num_clusters: 1
      max_num_clusters: 1
      auto_stop_mins: 1
      enable_photon: true
      tags:
        custom_tags:
          - key: workshop
            value: dbsql_workshop
