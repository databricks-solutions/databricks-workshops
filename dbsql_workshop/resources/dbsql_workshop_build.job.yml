# Build job: generates the data, metric views, keys, comments and tags, checks every demo scenario, then
# creates the saved queries and the visual data prep flow. The job run below runs it during every deploy
# that changes the build, and the deploy waits for it.
resources:
  jobs:
    dbsql_workshop_build:
      name: Bean & Brew - Build demo
      description: Builds the Bean & Brew Coffee Co. demo data and saved assets in the bundle's schemas.
      # Serverless, cost-optimized mode
      performance_target: STANDARD
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tags:
        workshop: dbsql_workshop
        aidevkit_project: ai-dev-kit
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${resources.schemas.dbsql_workshop_bronze.name}
        - name: silver_schema
          default: ${resources.schemas.dbsql_workshop_silver.name}
        - name: gold_schema
          default: ${resources.schemas.dbsql_workshop_gold.name}
        - name: warehouse_id
          default: ${var.warehouse_id}
        - name: llm_endpoint
          default: ${var.llm_endpoint}
        - name: asset_prefix
          default: "[dbsql_workshop ${workspace.current_user.short_name}] "
        - name: assets_folder
          default: ${workspace.root_path}/assets
      tasks:
        - task_key: bronze
          environment_key: default
          notebook_task:
            notebook_path: ../src/build/01_bronze.ipynb
        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: default
          notebook_task:
            notebook_path: ../src/build/02_silver.ipynb
        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: default
          notebook_task:
            notebook_path: ../src/build/03_gold.ipynb
        - task_key: semantic_layer
          depends_on:
            - task_key: gold
          environment_key: default
          notebook_task:
            notebook_path: ../src/build/04_semantic_layer.ipynb
        - task_key: validate
          depends_on:
            - task_key: semantic_layer
          environment_key: default
          notebook_task:
            notebook_path: ../src/build/05_validate.ipynb
        - task_key: saved_assets
          depends_on:
            - task_key: validate
          environment_key: default
          notebook_task:
            notebook_path: ../src/build/06_saved_assets.ipynb

