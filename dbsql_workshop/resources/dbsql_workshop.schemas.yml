# Silver and gold schemas. The name prefix turns "silver" into dbsql_workshop_silver.
# The bundle creates them (a schema that already exists makes the deploy fail rather than be reused) and
# destroy drops them with every table and metric view inside.
resources:
  schemas:
    dbsql_workshop_silver:
      name: silver
      catalog_name: ${var.catalog}
      comment: Cleaned, conformed Bean & Brew Coffee Co. data, loaded by the deploy.
    dbsql_workshop_gold:
      name: gold
      catalog_name: ${var.catalog}
      comment: Business-ready Bean & Brew Coffee Co. models and semantic metric views for BI, Genie, and alerts. Built in the workshop notebook.
