# Runs the build job as part of every deploy that changes the build. The deploy waits for the run and fails if it
# fails; the dashboard, Genie agent and alerts are created after it, so the tables they read already exist.
resources:
  job_runs:
    dbsql_workshop_build_run:
      job_id: ${resources.jobs.dbsql_workshop_build.id}
      lifecycle:
        # Re-run the build when its code or asset definitions change. A failed run is retried on the next deploy.
        triggers:
          - on_file_change: ../src/build/*
          - on_file_change: ../src/assets/*
          - on_file_change: ../src/assets/queries/*
