# AI/BI dashboard: 4 pages on the gold tables and metric views, published with embedded credentials.
# The definition is inline so the catalog and schema names can be filled in by the bundle.
resources:
  dashboards:
    dbsql_workshop_store_operations:
      display_name: "Bean & Brew Coffee Co - Store Operations"
      warehouse_id: ${var.warehouse_id}
      embed_credentials: true
      lifecycle:
        # Created after the build job run, so the tables they read already exist
        depends_on:
          - resource: job_runs.dbsql_workshop_build_run
      serialized_dashboard:
        {
          "datasets": [
            {
              "name": "store_sales_metrics",
              "displayName": "Store Sales Metrics",
              "asset_name": "${var.catalog}.${resources.schemas.dbsql_workshop_gold.name}.store_sales_metrics"
            },
            {
              "name": "customer_metrics",
              "displayName": "Customer Metrics",
              "asset_name": "${var.catalog}.${resources.schemas.dbsql_workshop_gold.name}.customer_metrics"
            },
            {
              "name": "product_sales_metrics",
              "displayName": "Product Sales Metrics",
              "asset_name": "${var.catalog}.${resources.schemas.dbsql_workshop_gold.name}.product_sales_metrics"
            },
            {
              "name": "inventory",
              "displayName": "Inventory Status",
              "queryLines": [
                "SELECT\n",
                "  store_id,\n",
                "  store_name,\n",
                "  region,\n",
                "  as_of_date,\n",
                "  item_code,\n",
                "  item_name,\n",
                "  unit_of_measure,\n",
                "  on_hand_qty,\n",
                "  par_level,\n",
                "  reorder_point,\n",
                "  pct_of_par,\n",
                "  inventory_value,\n",
                "  stock_status\n",
                "FROM\n",
                "  ${var.catalog}.${resources.schemas.dbsql_workshop_gold.name}.inventory_current_status\n",
                "ORDER BY\n",
                "  CASE stock_status\n",
                "    WHEN 'REORDER NOW' THEN 1\n",
                "    WHEN 'LOW' THEN 2\n",
                "    ELSE 3\n",
                "  END,\n",
                "  pct_of_par"
              ]
            },
            {
              "name": "hourly_traffic",
              "displayName": "Hourly Traffic",
              "config": {
                "version": "1.1",
                "source": "${var.catalog}.${resources.schemas.dbsql_workshop_gold.name}.store_hourly_traffic",
                "dimensions": [
                  {
                    "name": "store_id",
                    "expr": "store_id"
                  },
                  {
                    "name": "business_date",
                    "expr": "business_date"
                  },
                  {
                    "name": "business_hour",
                    "expr": "business_hour"
                  },
                  {
                    "name": "day_of_week",
                    "expr": "day_of_week"
                  }
                ],
                "measures": [
                  {
                    "name": "transactions",
                    "expr": "SUM(transactions)"
                  },
                  {
                    "name": "net_sales",
                    "expr": "SUM(net_sales)"
                  },
                  {
                    "name": "mobile_transactions",
                    "expr": "SUM(mobile_transactions)"
                  },
                  {
                    "name": "avg_transactions",
                    "expr": "AVG(transactions)"
                  }
                ]
              }
            },
            {
              "name": "store_perf",
              "displayName": "Store Performance",
              "config": {
                "source": "${var.catalog}.${resources.schemas.dbsql_workshop_gold.name}.store_daily_performance",
                "measures": [
                  {
                    "name": "transactions",
                    "expr": "SUM(source.transactions)"
                  },
                  {
                    "name": "net_sales",
                    "expr": "SUM(source.net_sales)"
                  },
                  {
                    "name": "items_sold",
                    "expr": "SUM(source.items_sold)"
                  }
                ],
                "version": "1.1",
                "dimensions": [
                  {
                    "name": "business_date",
                    "expr": "source.business_date"
                  },
                  {
                    "name": "store_id",
                    "expr": "source.store_id"
                  },
                  {
                    "name": "store_name",
                    "expr": "source.store_name"
                  },
                  {
                    "name": "city",
                    "expr": "source.city"
                  },
                  {
                    "name": "state",
                    "expr": "source.state"
                  },
                  {
                    "name": "region",
                    "expr": "source.region"
                  },
                  {
                    "name": "store_format",
                    "expr": "source.store_format"
                  },
                  {
                    "name": "latitude",
                    "expr": "store.latitude"
                  },
                  {
                    "name": "longitude",
                    "expr": "store.longitude"
                  }
                ],
                "joins": [
                  {
                    "name": "store",
                    "source": "${var.catalog}.${resources.schemas.dbsql_workshop_silver.name}.dim_store",
                    "on": "source.store_id = store.store_id"
                  }
                ]
              }
            }
