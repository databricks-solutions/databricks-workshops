# Loads the six raw (bronze) tables. Pure SQL on the bundle's own SQL warehouse, which starts in seconds.
# The job run below runs it during every deploy that changes the notebook, and the deploy waits for it.
# Everything after bronze is built interactively in "Bean & Brew DBSQL Workshop.ipynb".
resources:
  jobs:
    dbsql_workshop_raw_data:
      name: Bean & Brew - Load raw data
      description: Loads the Bean & Brew Coffee Co. raw (bronze) tables into the bundle's bronze schema.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tags:
        workshop: dbsql_workshop
        aidevkit_project: ai-dev-kit
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${resources.schemas.dbsql_workshop_bronze.name}
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/load_raw_data.ipynb
            warehouse_id: ${var.warehouse_id}
