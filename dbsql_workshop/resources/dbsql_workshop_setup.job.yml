# Setup: creates the silver and gold tables (gold stays empty) and the metric views, loads silver, then documents and
# tags the tables. Pure SQL on the SQL warehouse, which starts in seconds. The job run below runs it during every deploy
# that changes the setup notebooks, and the deploy waits for it.
resources:
  jobs:
    dbsql_workshop_setup:
      name: Bean & Brew - Set up demo data
      description: Creates the Bean & Brew silver and gold tables and the metric views, loads the silver tables, and adds column comments and tags.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      lifecycle:
        # The setup notebooks name the schemas directly. Waiting for them also means a second deploy into the same
        # workspace fails on the existing schemas before it creates anything else.
        depends_on:
          - resource: schemas.dbsql_workshop_silver
          - resource: schemas.dbsql_workshop_gold
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: create_tables
          notebook_task:
            notebook_path: ../src/setup/01_create_tables.sql
            warehouse_id: ${var.warehouse_id}
        - task_key: build_silver
          depends_on:
            - task_key: create_tables
          notebook_task:
            notebook_path: ../src/setup/02_build_silver.sql
            warehouse_id: ${var.warehouse_id}
        - task_key: document
          depends_on:
            - task_key: build_silver
          notebook_task:
            notebook_path: ../src/setup/03_document.sql
            warehouse_id: ${var.warehouse_id}
