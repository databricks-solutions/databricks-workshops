flights_workshop:
  outputs:
    dev:
      type: databricks
      catalog: "{{ env_var('DBT_DATABRICKS_CATALOG') }}"
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_PATH') }}"
      schema: "{{ env_var('DBT_DATABRICKS_SCHEMA') }}"
      token: "{{ env_var('DBT_ACCESS_TOKEN') }}"
      threads: 12
  target: dev
