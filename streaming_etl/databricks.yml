# This is a Databricks asset bundle definition for streaming_etl.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: streaming_etl

include:
  - resources/*.yml

variables:
  catalog: 
    default: "dustin_vannoy_catalog"
  schema: 
    default: "dustin_vannoy_workshop"
  ldp_schema: 
    default: "dustin_vannloy_ldp_dev"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://company-dev.cloud.databricks.com

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://company-prod.cloud.databricks.com
